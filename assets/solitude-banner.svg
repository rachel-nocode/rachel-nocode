<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Rachel noCode — Solitude terminal</title>
  <desc id="desc">An animated monochrome terminal banner with an orange prompt and shifting ASCII signal.</desc>

  <style>
    :root {
      --bg: #101315;
      --line: #343d41;
      --muted: #798186;
      --text: #cacccc;
      --bright: #d9dbdc;
      --ember: #de6145;
    }

    text {
      font-family: "Berkeley Mono", "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
      font-variant-ligatures: none;
    }

    .signal-a { animation: signal-a 4.8s steps(1, end) infinite; }
    .signal-b { animation: signal-b 4.8s steps(1, end) infinite; opacity: 0; }
    .signal-c { animation: signal-c 4.8s steps(1, end) infinite; opacity: 0; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    .status { animation: breathe 2.4s ease-in-out infinite; }

    @keyframes signal-a { 0%, 31% { opacity: 1 } 32%, 100% { opacity: 0 } }
    @keyframes signal-b { 0%, 31% { opacity: 0 } 32%, 64% { opacity: 1 } 65%, 100% { opacity: 0 } }
    @keyframes signal-c { 0%, 64% { opacity: 0 } 65%, 100% { opacity: 1 } }
    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes breathe { 0%, 100% { opacity: .48 } 50% { opacity: 1 } }

    @media (prefers-reduced-motion: reduce) {
      .signal-a, .cursor, .status { animation: none }
      .signal-b, .signal-c { display: none }
    }
  </style>

  <rect width="960" height="300" rx="10" fill="var(--bg)"/>
  <rect x="1" y="1" width="958" height="298" rx="9" fill="none" stroke="var(--line)" stroke-width="2"/>

  <circle cx="27" cy="25" r="4" fill="var(--ember)"/>
  <circle cx="43" cy="25" r="4" fill="var(--muted)" opacity=".65"/>
  <circle cx="59" cy="25" r="4" fill="var(--muted)" opacity=".35"/>
  <text x="84" y="31" fill="var(--muted)" font-size="14">rachel@solitude: ~/builds</text>
  <text x="875" y="31" fill="var(--muted)" font-size="14">01 / 03</text>
  <path d="M1 49H959" stroke="var(--line)"/>

  <g fill="var(--muted)" font-size="15">
    <text x="26" y="80">SIGNAL</text>
    <text x="850" y="80" class="status">● LIVE</text>
  </g>

  <g fill="var(--bright)" font-size="19">
    <g class="signal-a">
      <text x="25" y="116">▁▂▄▇▅▃▁  ▁▃▆█▆▃▁  ▁▂▅▇▄▂▁  ▁▃▅█▅▂▁  ▁▂▄▆▄▂▁</text>
      <text x="25" y="142" fill="var(--muted)">··╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲··</text>
    </g>
    <g class="signal-b">
      <text x="25" y="116">▃▆█▅▂▁▂  ▂▄▇▆▃▁▂  ▁▄█▅▂▁▃  ▂▅▇▄▂▁▂  ▃▆█▅▂▁▂</text>
      <text x="25" y="142" fill="var(--muted)">·╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲···</text>
    </g>
    <g class="signal-c">
      <text x="25" y="116">▆█▅▂▁▂▄  ▄▇▆▃▁▂▅  ▄█▅▂▁▃▆  ▅▇▄▂▁▂▅  ▆█▅▂▁▂▄</text>
      <text x="25" y="142" fill="var(--muted)">╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····╱╲····</text>
    </g>
  </g>

  <text x="25" y="194" fill="var(--ember)" font-size="18">➜</text>
  <text x="54" y="194" fill="var(--text)" font-size="18">rachel-nocode</text>
  <text x="207" y="194" fill="var(--muted)" font-size="18">build --small --useful --human</text>
  <rect x="553" y="179" width="10" height="20" rx="1" fill="var(--text)" class="cursor"/>

  <text x="25" y="237" fill="var(--bright)" font-size="25" font-weight="700">tiny tools. useful systems. honest tutorials.</text>
  <text x="25" y="269" fill="var(--muted)" font-size="15">NO-CODE / AI / BUILDING IN PUBLIC</text>
  <text x="897" y="269" fill="var(--ember)" font-size="15">RN—26</text>
</svg>
